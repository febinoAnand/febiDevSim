<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Device Simulator — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-icon">&#9679;</span> Device Simulator</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="active"><span class="nav-icon">&#128202;</span> Dashboard</a>
        <a href="projects.html" data-module="projects"><span class="nav-icon">&#128193;</span> Projects</a>
        <a href="devices.html" data-module="devices"><span class="nav-icon">&#128225;</span> Virtual Device</a>
        <a href="users.html" data-module="users"><span class="nav-icon">&#128100;</span> Users</a>
        <a href="roles.html" data-module="roles"><span class="nav-icon">&#128274;</span> Roles</a>
        <a href="#" id="logoutBtn"><span class="nav-icon">&#8677;</span> Logout</a>
      </nav>
      <div class="sidebar-footer" id="usernameLabel"></div>
    </aside>

    <main class="main-content">
      <section id="tab-dashboard">
        <div class="section-heading">
          <div>
            <h2>Dashboard</h2>
            <p class="section-subtitle">Live overview of your projects, devices, and their current status.</p>
          </div>
        </div>

        <div class="stat-grid" id="statGrid"></div>

        <div class="card">
          <div class="card-header">
            <h3>Last Sent Data by Device</h3>
          </div>
          <div class="line-chart-wrap" id="sentActivityChart"></div>
          <div class="chart-legend" id="sentActivityLegend"></div>
        </div>

        <div class="dashboard-columns">
          <div class="card">
            <div class="card-header">
              <h3>Recent Projects</h3>
              <a href="projects.html">View all &rarr;</a>
            </div>
            <div id="recentProjectsList"></div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>Unassigned Devices</h3>
              <a href="devices.html">Manage devices &rarr;</a>
            </div>
            <div id="unassignedDevicesList"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
