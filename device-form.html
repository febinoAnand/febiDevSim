<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Device Simulator — Add Device</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container flex-between">
      <h2>Device Simulator</h2>
      <a href="devices.html">&larr; Back to Devices</a>
    </div>
  </header>

  <main class="container">
    <div class="card form-card">
      <div class="card-header">
        <h3 id="deviceFormTitle">Add Virtual Device</h3>
      </div>
      <form id="deviceForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="deviceName">Device Name *</label>
            <input type="text" id="deviceName" placeholder="e.g. Temp Sensor 02" />
          </div>
          <div class="form-group">
            <label for="deviceLocation">Location</label>
            <input type="text" id="deviceLocation" placeholder="e.g. Warehouse B" />
          </div>
          <div class="form-group">
            <label for="deviceSerial">Serial Number</label>
            <input type="text" id="deviceSerial" placeholder="e.g. SN-1004" />
          </div>
          <div class="form-group">
            <label for="deviceType">Type</label>
            <input type="text" id="deviceType" placeholder="e.g. Temperature Sensor" />
          </div>
          <div class="form-group">
            <label for="deviceProtocol">Protocol</label>
            <select id="deviceProtocol">
              <option value="MQTT">MQTT</option>
              <option value="HTTP">HTTP</option>
            </select>
          </div>
          <div class="form-group">
            <label for="deviceStatus">Status</label>
            <select id="deviceStatus">
              <option value="online">Online</option>
              <option value="offline">Offline</option>
              <option value="idle">Idle</option>
            </select>
          </div>
          <div class="form-group">
            <label for="deviceHost">Host</label>
            <input type="text" id="deviceHost" placeholder="e.g. broker.hivemq.com" />
          </div>
          <div class="form-group">
            <label for="devicePort">Port</label>
            <input type="text" id="devicePort" placeholder="e.g. 1883" />
          </div>
          <div class="form-group">
            <label for="deviceMessageType">Message Type</label>
            <select id="deviceMessageType">
              <option value="JSON">JSON</option>
              <option value="String">String</option>
            </select>
          </div>
          <div class="form-group">
            <label for="deviceInterval">Time Interval <span class="label-hint">(seconds between messages)</span></label>
            <input type="number" id="deviceInterval" min="1" placeholder="e.g. 5" />
          </div>
          <div class="form-group span-2">
            <label for="deviceSampleMessage">Sample Message <span class="label-hint">(template used to generate simulated traffic)</span></label>
            <textarea id="deviceSampleMessage" rows="3" placeholder='e.g. {"temperature": 22.5, "unit": "C"}'></textarea>
          </div>
        </div>
        <div class="login-error" id="deviceFormError"></div>
        <div class="flex gap-sm">
          <button type="submit" class="btn btn-primary btn-gradient" style="width: auto;" id="deviceSubmitBtn">+ Add Device</button>
          <a href="devices.html" class="btn" style="width: auto;">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/device-form.js"></script>
</body>
</html>
